# Smithery configuration for Veículo
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_veiculo

name: veiculo-mcp
displayName: "Veículo"
description: >
  Consulta dados de um veículo pela placa em fontes oficiais (marca/modelo, ano, situação, restrições). Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/veiculo-mcp
repository: https://github.com/mcp-dir/veiculo-mcp

tags:
  - veiculo
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_veiculo

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_veiculo/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
